name: backend-ci
on:
  push:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          GEMINI_API_KEY: dummy-for-build
